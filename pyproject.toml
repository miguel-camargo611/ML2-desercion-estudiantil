[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desercion"
version = "0.3.0"
description = "Predicción de deserción estudiantil (Tec de Monterrey) reproduciendo y adaptando Villar & Andrade (2024)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Miguel Camargo" },
  { name = "Camilo Hernández" },
]
license = { text = "MIT" }
# Versiones exactas con las que se generaron los resultados de reports/ (reproducibilidad).
dependencies = [
  "pandas==3.0.6",
  "numpy==2.5.3",
  "scikit-learn==1.9.1",
  "imbalanced-learn==0.14.2",
  "xgboost==3.4.1",
  "lightgbm==4.7.0",
  "catboost==1.2.10",
  "shap==0.52.0",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "matplotlib==3.11.2",
  "openpyxl==3.1.5",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "ipykernel==7.3.0", "nbconvert==7.17.1"]
deploy = ["streamlit==1.66.1"]   # app de deploy/ (la imagen Docker usa deploy/requirements.txt)

[project.scripts]
desercion = "desercion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "deploy/tests"]
addopts = "-q"
