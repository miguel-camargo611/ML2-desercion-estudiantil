# Configuración central del proyecto. Todas las rutas son relativas a la raíz del repo.
seed: 42

paths:
  raw_dir: data/raw                   # aquí va el Excel del TEC DataHub (cualquier nombre .xlsx)
  interim_data: data/interim/students.parquet
  split: data/processed/split.parquet
  processed_dir: data/processed
  figures_dir: reports/figures
  tables_dir: reports/tables

# Población de estudio: solo pregrado (educación superior, como en el artículo base).
population:
  level: Undergraduate

# Población de estudio: cohortes que registran el desempeño del primer semestre. La partición
# desarrollo/prueba se hizo sobre todo el pregrado (AD14–AD20) y no se recalcula, para no tocar
# el conjunto de prueba sellado.
study_generations: [AD19, AD20]

split:
  test_size: 0.20          # conjunto de prueba sellado hasta la Entrega final

cv:
  outer_folds: 5           # validación cruzada externa (estimación del desempeño)
  inner_folds: 3           # validación cruzada interna (ajuste de hiperparámetros)
  threshold_folds: 3       # validación interna para calibrar el umbral de decisión

metrics:
  tuning: average_precision   # métrica para GridSearchCV (independiente del umbral)
  threshold_beta: 2           # F-beta para fijar el umbral: el recall pesa el doble

onehot_min_frequency: 30      # categorías con menos registros se agrupan como "infrecuentes"

# Modelo que se interpreta con SHAP en ambos escenarios (mejor en A, empatado con el mejor en B
# y sin SMOTE, cuyas muestras sintéticas sobre columnas one-hot distorsionan la lectura).
interpret_model: CatBoost nativo
